<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output</title>
</head>
<body>
    <p align="right"><b>V.Padma <br>24K61A12B9</br></b></p>

    <h2>Different Ways of Displaying Output</h2>
    <p id="demo"></p>
    <script>
        document.write("1. Output using document.write()<br>");
        document.getElementById("demo").innerHTML =
            "2. Output using innerHTML";
        console.log("3. Output using console.log()");
        alert("4. Output using alert()");
    </script>
</body>
</html>
