<script>
document.write("For loop:<br>");
for(var i = 1; i <= 10; i++) {
    document.write(i + " ");
}

document.write("<br>While loop:<br>");
var j = 1;
while(j <= 10) {
    document.write(j + " ");
    j++;
}

document.write("<br>Do-while loop:<br>");
var k = 1;
do {
    document.write(k + " ");
    k++;
} while(k <= 10);
</script>
