<!DOCTYPE html>
<html>
<head>
    <title>Larger Number</title>
</head>
<body>

<p align="right"><b>V.Padma <br>24K61A12B9</br></b></p>

<h2>Find Larger Number</h2>

<script>
let a = parseInt(prompt("Enter first integer:"));
let b = parseInt(prompt("Enter second integer:"));
let c = parseInt(prompt("Enter third integer:"));

if (a == b && b == c) {
    document.write("EQUAL NUMBERS");
    alert("EQUAL NUMBERS");
}
else {
    let largest = Math.max(a, b, c);
    document.write(largest + " LARGER NUMBER");
    alert(largest + " LARGER NUMBER");
}
</script>

</body>
</html>
