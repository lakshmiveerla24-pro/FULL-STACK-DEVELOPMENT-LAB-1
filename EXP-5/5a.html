<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>
    <p align="right"><b>24K61A12B9<br>V.PADMA</b></p>
    <style>
        h2 {
            color: red;
        }

        .hex {
            color: #0000FF;
        }

        .rgb {
            color: rgb(0, 128, 0);
        }

        .hsl {
            color: hsl(300, 100%, 50%);
        }
    </style>
</head>
<body>

    <h2>Color Name</h2>
    <p class="hex">HEX Color</p>
    <p class="rgb">RGB Color</p>
    <p class="hsl">HSL Color</p>

</body>
</html>
