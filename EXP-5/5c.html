<!DOCTYPE html>
<html>
<head>
    <title>CSS Font and Text</title>
<p align="right"><b>24K61A12B9<br>V.PADMA</b></p>
    <style>
        .size {
            font-size: 25px;
        }
        .weight {
            font-weight: bold;
        }
        .style {
            font-style: italic;
        }
        .decoration {
            text-decoration: underline;
        }
        .transform {
            text-transform: uppercase;
        }
        .alignment {
            text-align: center;
        }
    </style>
</head>
<body>
    <p class="size">Font Size Example</p>
    <p class="weight">Font Weight Example</p>
    <p class="style">Font Style Example</p>
    <p class="decoration">Text Decoration Example</p>
    <p class="transform">text transformation example</p>
    <p class="alignment">Text Alignment Example</p>
</body>
</html>
