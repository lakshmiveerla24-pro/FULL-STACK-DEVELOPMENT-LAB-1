</head>
<body>

<p align="right"><b>V.Padma <br>24K61A12B9</br></b></p>

<h2>Array Object Example</h2>

<script>
let fruits = ["Apple", "Banana", "Mango"];

document.write("Original Array: " + fruits + "<br>");
document.write("Length: " + fruits.length + "<br>");

fruits.push("Orange");
document.write("After Push: " + fruits + "<br>");

fruits.pop();
document.write("After Pop: " + fruits + "<br>");

fruits.sort();
document.write("After Sort: " + fruits + "<br>");

fruits.reverse();
document.write("After Reverse: " + fruits);
</script>

</body>
</html>
