<!DOCTYPE html>
<html>
<head>
    <title>User Defined Object</title>
</head>
<body>

<p align="right"><b>V.Padma <br>24K61A12B9</br></b></p>

<h2>User Defined Object Example</h2>

<script>
class Student {
    constructor(name, age, course) {
        this.name = name;
        this.age = age;
        this.course = course;
    }

    get studentName() {
        return this.name;
    }

    set studentName(name) {
        this.name = name;
    }

    display() {
        document.write("Student Name: " + this.name + "<br>");
        document.write("Age: " + this.age + "<br>");
        document.write("Course: " + this.course + "<br>");
    }
}

let student = new Student("Lakshmi", 20, "B.Tech IT");

student.display();

student.studentName = "Padma";

document.write("<br>After using Setter:<br>");
document.write("Student Name: " + student.studentName);
</script>

</body>
</html>
